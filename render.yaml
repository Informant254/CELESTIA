# Isolated media-engine service blueprint. Only on feature branch; CELESTIA main is untouched.
services:
  - type: web
    name: novahex-media-engine
    runtime: docker
    plan: free
    region: frankfurt
    branch: feature/novahex-media-engine-v1
    dockerContext: media-engine
    dockerfilePath: media-engine/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NOVAHEX_API_KEY
        sync: false
      - key: MAX_MEDIA_MB
        value: "35"
