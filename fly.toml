# Fly.io — she stays awake here (machines never auto-stop).
app = "celestia"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[env]
  BOT_NAME = "CELESTIA"
  BOT_PREFIX = "."
  TIMEZONE = "Africa/Nairobi"
  LOG_LEVEL = "info"
  NODE_ENV = "production"
# Secrets to set with `fly secrets set` (never commit):
#   SESSION_ID, OWNER_NUMBER, OPENAI_API_KEY, GEMINI_API_KEY, DASHBOARD_API_KEY
