<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#111a38"/>
      <stop offset="45%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#030510"/>
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="35%" stop-color="#7a52ff"/>
      <stop offset="70%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfeaff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="33%" stop-color="#7a52ff"/>
      <stop offset="66%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1024" height="1024" rx="210" fill="url(#bg)"/>

  <!-- aurora ribbons -->
  <path d="M -60 190 C 280 60 640 320 1080 140" fill="none" stroke="#00e5ff" stroke-width="60" opacity="0.10"/>
  <path d="M -40 380 C 340 250 700 470 1080 300" fill="none" stroke="#7a52ff" stroke-width="70" opacity="0.12"/>
  <path d="M -80 520 C 320 420 640 560 1080 440" fill="none" stroke="#ff2e93" stroke-width="50" opacity="0.09"/>

  <!-- starfield: dots only -->
  <g fill="#ffffff">
    <circle cx="98" cy="128" r="2"/><circle cx="176" cy="212" r="1.4"/><circle cx="304" cy="96" r="1.7"/>
    <circle cx="428" cy="150" r="1.3"/><circle cx="560" cy="72" r="1.6"/><circle cx="692" cy="118" r="1.9"/>
    <circle cx="828" cy="88" r="1.4"/><circle cx="926" cy="176" r="2"/><circle cx="72" cy="336" r="1.5"/>
    <circle cx="948" cy="330" r="1.6"/><circle cx="920" cy="560" r="1.4"/><circle cx="66" cy="600" r="1.7"/>
    <circle cx="240" cy="290" r="1.2"/><circle cx="800" cy="280" r="1.3"/><circle cx="150" cy="706" r="1.4"/>
    <circle cx="880" cy="660" r="1.5"/><circle cx="512" cy="60" r="1.3"/>
  </g>
  <!-- sparkle crosses (vector strokes) -->
  <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M 208 318 v 22 M 197 329 h 22"/>
    <path d="M 836 388 v 18 M 827 397 h 18" opacity="0.8"/>
    <path d="M 128 556 v 16 M 120 564 h 16" opacity="0.7"/>
  </g>

  <!-- orbit ring behind wolf -->
  <circle cx="512" cy="460" r="252" fill="none" stroke="url(#ring)" stroke-width="2.2" opacity="0.5"/>
  <circle cx="512" cy="460" r="238" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.10"/>
  <!-- ring tick marks -->
  <g stroke="url(#ring)" stroke-width="1.4" opacity="0.55">
    <path d="M 512 208 v 14"/>
    <path d="M 512 698 v 14"/>
    <path d="M 260 460 h 14"/>
    <path d="M 750 460 h 14"/>
    <path d="M 334 282 l 10 10"/>
    <path d="M 680 628 l 10 10"/>
    <path d="M 334 638 l 10 -10"/>
    <path d="M 680 292 l 10 -10"/>
  </g>

  <!-- ═══════ FRONT-FACING CONSTELLATION WOLF ═══════ -->
  <g transform="translate(512,470)" filter="url(#soft)">
    <!-- star nodes: ears, brow, cheeks, muzzle -->
    <g fill="#ffffff">
      <circle cx="-96" cy="-178" r="6"/>
      <circle cx="-40" cy="-224" r="7"/>
      <circle cx="40" cy="-224" r="7"/>
      <circle cx="96" cy="-178" r="6"/>
      <!-- brow ridge -->
      <circle cx="-88" cy="-96" r="5"/>
      <circle cx="88" cy="-96" r="5"/>
      <!-- cheeks -->
      <circle cx="-128" cy="-8" r="5.5"/>
      <circle cx="128" cy="-8" r="5.5"/>
      <!-- muzzle -->
      <circle cx="-56" cy="60" r="5"/>
      <circle cx="56" cy="60" r="5"/>
      <circle cx="0" cy="118" r="6"/>
      <!-- crown star crown-of-stars above head -->
      <circle cx="-84" cy="-268" r="4.5"/>
      <circle cx="0" cy="-300" r="6"/>
      <circle cx="84" cy="-268" r="4.5"/>
    </g>

    <!-- constellation lines: symmetric wolf geometry -->
    <g stroke="url(#neon)" stroke-width="2.4" fill="none" stroke-linecap="round">
      <!-- left ear -->
      <path d="M -128 -120 L -96 -178 L -40 -132"/>
      <!-- right ear -->
      <path d="M 128 -120 L 96 -178 L 40 -132"/>
      <!-- crown of stars -->
      <path d="M -84 -268 L 0 -300 L 84 -268"/>
      <path d="M -84 -268 L -40 -224 L 84 -268 L 40 -224 Z" opacity="0.7"/>
      <!-- brow -->
      <path d="M -40 -224 L -88 -96 M 40 -224 L 88 -96"/>
      <path d="M -88 -96 L 88 -96" opacity="0.35"/>
      <!-- temples to cheeks -->
      <path d="M -88 -96 L -128 -8 M 88 -96 L 128 -8"/>
      <!-- cheeks to muzzle -->
      <path d="M -128 -8 L -56 60 M 128 -8 L 56 60"/>
      <!-- muzzle diamond -->
      <path d="M -56 60 L 0 118 L 56 60"/>
      <path d="M -56 60 L 56 60" opacity="0.4"/>
    </g>

    <!-- the eyes: neon diamonds (vector, no emoji) -->
    <g filter="url(#glow)">
      <path d="M -78 -64 L -60 -46 L -78 -28 L -96 -46 Z" fill="url(#neon)"/>
      <path d="M 78 -64 L 96 -46 L 78 -28 L 60 -46 Z" fill="url(#neon)"/>
    </g>

    <!-- nose: small vector triangle -->
    <path d="M -10 106 L 0 118 L 10 106 L 0 100 Z" fill="#ffffff" opacity="0.95"/>

    <!-- howl pulse lines rising from crown -->
    <g stroke="url(#neon)" stroke-width="1.8" fill="none" opacity="0.6">
      <path d="M -34 -330 q -10 -16 0 -32" />
      <path d="M 0 -334 q -12 -20 0 -40" opacity="0.8"/>
      <path d="M 34 -330 q 10 -16 0 -32" />
    </g>
  </g>

  <!-- ═══════ VECTOR WORDMARK "CELESTIA" ═══════ -->
  <!-- pure strokes, letter by letter, spacing 116px grid -->
  <g transform="translate(512,842)" stroke="url(#neon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- C -->
    <path d="M -336 -34 a 40 40 0 1 0 0 68"/>
    <!-- E -->
    <path d="M -284 -40 h 52 v 0 M -284 -40 v 80 h 52 M -284 0 h 40"/>
    <!-- L -->
    <path d="M -206 -40 v 80 h 52"/>
    <!-- E -->
    <path d="M -134 -40 h 52 M -134 -40 v 80 h 52 M -134 0 h 40"/>
    <!-- S -->
    <path d="M -46 -38 a 22 22 0 1 0 22 22 a 22 22 0 1 1 22 22"/>
    <!-- T -->
    <path d="M 52 -40 h 56 M 80 -40 v 80"/>
    <!-- I -->
    <path d="M 132 0 v 0 M 132 -40 v 0"/>
    <path d="M 132 -40 v 80"/>
    <!-- A -->
    <path d="M 208 40 L 236 -40 L 264 40 M 218 12 h 36"/>
  </g>

  <!-- subtitle: plain latin, no emoji -->
  <text x="512" y="898" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="9" fill="#8ea6c8">THE MOST BEAUTIFUL BOT</text>

  <!-- divider: vector star between rules -->
  <g transform="translate(512,936)">
    <line x1="-150" y1="0" x2="-26" y2="0" stroke="url(#neon)" stroke-width="1.4" opacity="0.8"/>
    <path d="M 0 -12 L 3.2 -3.2 L 12 0 L 3.2 3.2 L 0 12 L -3.2 3.2 L -12 0 L -3.2 -3.2 Z" fill="url(#neon)"/>
    <line x1="26" y1="0" x2="150" y2="0" stroke="url(#neon)" stroke-width="1.4" opacity="0.8"/>
  </g>

  <!-- lineage text -->
  <text x="512" y="972" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="6" fill="#5d7194">WOLFTECH  ·  CELESTIA  ·  CONSTELLATION</text>
</svg>
