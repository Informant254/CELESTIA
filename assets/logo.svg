<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1a2e"/>
      <stop offset="55%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <!-- Neon gradient for wolf -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#7c4dff"/>
      <stop offset="70%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ff8a00"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Inner shadow for ring -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#7c4dff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff2e93" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#ff8a00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#7c4dff" stroke-width="1">
    <line x1="0" y1="256" x2="1024" y2="256"/><line x1="0" y1="512" x2="1024" y2="512"/><line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/><line x1="512" y1="0" x2="512" y2="1024"/><line x1="768" y1="0" x2="768" y2="1024"/>
  </g>

  <!-- Outer neon ring -->
  <circle cx="512" cy="440" r="265" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.85" filter="url(#glow)"/>
  <circle cx="512" cy="440" r="248" fill="none" stroke="white" stroke-width="0.7" opacity="0.12"/>

  <!-- Wolf head - geometric low-poly style -->
  <g transform="translate(512,440)" filter="url(#glow)" opacity="0.98">
    <!-- Ears -->
    <path d="M -110 -85 L -75 -145 L -40 -85 Z" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 40 -85 L 75 -145 L 110 -85 Z" fill="none" stroke="url(#neon)" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M -110 -85 L -75 -145 L -40 -85 Z" fill="url(#neon)" opacity="0.12"/>
    <path d="M 40 -85 L 75 -145 L 110 -85 Z" fill="url(#neon)" opacity="0.12"/>
    <!-- Head outline - hexagon wolf -->
    <path d="M 0 -105 L 95 -45 L 95 55 L 0 115 L -95 55 L -95 -45 Z" fill="none" stroke="url(#neon)" stroke-width="5" stroke-linejoin="round" opacity="0.95"/>
    <!-- Inner facets -->
    <path d="M 0 -105 L 0 -25 L -45 10 L -95 -45" fill="none" stroke="white" stroke-width="1.2" opacity="0.18"/>
    <path d="M 0 -105 L 0 -25 L 45 10 L 95 -45" fill="none" stroke="white" stroke-width="1.2" opacity="0.18"/>
    <path d="M -45 10 L 0 35 L 45 10 L 0 -25 Z" fill="url(#neon)" opacity="0.18" stroke="white" stroke-width="0.8" stroke-opacity="0.2"/>
    <!-- Snout -->
    <path d="M -45 10 L -38 55 L 0 78 L 38 55 L 45 10" fill="none" stroke="url(#neon)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M -38 55 L 0 35 L 38 55" fill="none" stroke="white" stroke-width="1" opacity="0.25"/>
    <!-- Eyes - neon diamonds -->
    <g fill="url(#neon)" filter="url(#textGlow)">
      <path d="M -52 -10 L -38 0 L -52 10 L -66 0 Z" opacity="0.95"/>
      <path d="M 52 -10 L 66 0 L 52 10 L 38 0 Z" opacity="0.95"/>
    </g>
    <circle cx="-52" cy="0" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="52" cy="0" r="3.5" fill="white" opacity="0.95"/>
    <!-- Nose -->
    <path d="M -10 62 L 0 72 L 10 62 L 0 56 Z" fill="white" opacity="0.9"/>
    <!-- Circuit lines on cheeks -->
    <g stroke="url(#neon)" stroke-width="1.2" opacity="0.35" fill="none">
      <path d="M -95 15 L -115 15 L -115 35"/>
      <circle cx="-115" cy="38" r="3" fill="url(#neon)" opacity="0.8"/>
      <path d="M 95 15 L 115 15 L 115 35"/>
      <circle cx="115" cy="38" r="3" fill="url(#neon)" opacity="0.8"/>
    </g>
  </g>

  <!-- Brand text -->
  <text x="512" y="760" text-anchor="middle" font-family="Orbitron, Montserrat, sans-serif" font-size="76" font-weight="800" letter-spacing="13" fill="white" filter="url(#textGlow)">CELESTIA</text>
  <text x="512" y="795" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="18" font-weight="400" letter-spacing="11" fill="#8a9bb5" opacity="0.95">THE MOST BEAUTIFUL BOT</text>
  <!-- Tagline -->
  <g opacity="0.75">
    <line x1="360" y1="822" x2="472" y2="822" stroke="url(#neon)" stroke-width="1.2"/>
    <circle cx="512" cy="822" r="3.5" fill="url(#neon)"/>
    <line x1="552" y1="822" x2="664" y2="822" stroke="url(#neon)" stroke-width="1.2"/>
  </g>
  <text x="512" y="855" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="15" font-weight="300" letter-spacing="5.5" fill="#6b7a99">HEAVENLY • ELEGANT • VPS READY</text>
  <text x="512" y="880" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="11" font-weight="400" letter-spacing="4" fill="#4a5a7a" opacity="0.7">HEAVENLY • VPS HOSTABLE • 414 COMMANDS • HARDENED</text>

  <!-- Bottom shine -->
  <ellipse cx="512" cy="980" rx="320" ry="18" fill="url(#neon)" opacity="0.08"/>
</svg>
